<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>IL MIO GIOCO - Quiz Show Italiano</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d0a0b;
      font-family: 'Montserrat', sans-serif;
      touch-action: none;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #000;
      overflow: hidden;
    }
    canvas {
      flex: 1;
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
    }

    /* HUD */
    #hud {
      position: absolute;
      top: env(safe-area-inset-top, 10px);
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 20;
    }
    .hud-card {
      background: rgba(18, 14, 22, 0.88);
      border: 1px solid rgba(212, 175, 55, 0.6);
      padding: 6px 12px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .hud-card .gold { color: #ffd700; }
    .hud-card .hearts { color: #ff3366; letter-spacing: 2px; }

    /* Сенсорный геймпад для телефонов */
    #touch-controls {
      position: absolute;
      bottom: max(16px, env(safe-area-inset-bottom, 16px));
      left: 0;
      right: 0;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      z-index: 30;
      pointer-events: none;
    }
    .d-pad, .action-buttons {
      display: flex;
      gap: 14px;
      pointer-events: auto;
    }
    .t-btn {
      width: 66px;
      height: 66px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255, 215, 0, 0.35), rgba(15, 12, 18, 0.85));
      border: 2px solid #d4af37;
      color: #ffd700;
      font-size: 26px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 20px rgba(0,0,0,0.6), inset 0 0 10px rgba(212, 175, 55, 0.3);
      cursor: pointer;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      touch-action: manipulation;
    }
    .t-btn:active, .t-btn.active {
      transform: scale(0.92);
      background: radial-gradient(circle at 30% 30%, rgba(255, 215, 0, 0.6), rgba(60, 45, 10, 0.95));
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.8);
      border-color: #fff;
    }
    .t-btn.jump-btn {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255, 51, 102, 0.4), rgba(20, 10, 15, 0.9));
      border: 2px solid #ff3366;
      color: #fff;
      font-family: 'Cinzel', serif;
      font-size: 15px;
      font-weight: 900;
      box-shadow: 0 6px 20px rgba(255, 51, 102, 0.4);
    }
    .t-btn.jump-btn:active, .t-btn.jump-btn.active {
      transform: scale(0.92);
      background: radial-gradient(circle at 30% 30%, rgba(255, 51, 102, 0.8), rgba(90, 10, 30, 0.95));
    }

    /* Модальные окна */
    .screen-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(16, 12, 24, 0.96) 0%, rgba(5, 3, 8, 0.99) 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 20px;
      text-align: center;
      color: #fff;
    }
    .screen-overlay.hidden { display: none !important; }

    .gold-title {
      font-family: 'Cinzel', serif;
      font-size: clamp(26px, 6vw, 42px);
      font-weight: 900;
      background: linear-gradient(180deg, #fff2a3 0%, #ffd700 40%, #b8860b 80%, #704f
