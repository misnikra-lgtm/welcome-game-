<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>BUON COMPLEANNO, AMORE MIO!</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #0a060d;
      font-family: 'Montserrat', sans-serif;
      touch-action: none;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: #0a060d;
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
    }

    #hud {
      position: absolute;
      top: max(10px, env(safe-area-inset-top, 10px));
      left: 10px;
      right: 56px;
      display: none;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 50;
    }
    .hud-card {
      background: rgba(18, 12, 24, 0.92);
      border: 1.5px solid rgba(212, 175, 55, 0.7);
      padding: 6px 12px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    }
    .hud-card .gold { color: #ffd700; }
    .hud-card .hearts { color: #ff3366; letter-spacing: 2px; }

    #progress-wrap {
      position: absolute;
      top: max(54px, calc(env(safe-area-inset-top, 10px) + 44px));
      left: 16px;
      right: 16px;
      height: 8px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(212, 175, 55, 0.5);
      border-radius: 4px;
      overflow: hidden;
      z-index: 45;
      display: none;
      pointer-events: none;
    }
    #progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ffd700, #ff3366);
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
      transition: width 0.1s linear;
    }

    #touch-controls {
      position: absolute;
      bottom: max(90px, calc(env(safe-area-inset-bottom, 20px) + 70px));
      left: 0;
      right: 0;
      padding: 0 18px;
      display: none;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      pointer-events: none;
    }
    .d-pad, .action-buttons {
      display: flex;
      gap: 14px;
      pointer-events: auto;
    }
    .t-btn {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255, 215, 0, 0.35), rgba(15, 12, 20, 0.92));
      border: 2.5px solid #ffd700;
      color: #ffd700;
      font-size: 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 25px rgba(0,0,0,0.8), inset 0 0 10px rgba(212, 175, 55, 0.4);
      cursor: pointer;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    .t-btn:active, .t-btn.active {
      transform: scale(0.92);
      background: radial-gradient(circle at 30% 30%, rgba(255, 215, 0, 0.7), rgba(40, 30, 10, 0.98));
      border-color: #fff;
      color: #fff;
    }
    .t-btn.jump-btn {
      width: 84px;
      height: 84px;
      background: radial-gradient(circle at 30% 30%, rgba(255, 51, 102, 0.45), rgba(25, 10, 18, 0.95));
      border: 2.5px solid #ff3366;
      color: #fff;
      font-family: 'Cinzel', serif;
      font-size: 15px;
      font-weight: 900;
      box-shadow: 0 8px 25px rgba(0,0,0,0.8), inset 0 0 12px rgba(255, 51, 102, 0.4);
    }
    .t-btn.jump-btn:active, .t-btn.jump-btn.active {
      transform: scale(0.92);
      background: radial-gradient(circle at 30% 30%, rgba(255, 51, 102, 0.8), rgba(60, 10, 25, 0.98));
    }

    .screen-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(16, 10, 24, 0.97) 0%, rgba(5, 3, 8, 0.99) 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 150;
      padding: 16px;
      text-align: center;
      color: #fff;
    }
    .screen-overlay.hidden { display: none !important; }

    .gold-title {
      font-family: 'Cinzel', serif;
      font-size: clamp(20px, 5.2vw, 34px);
      font-weight: 900;
      background: linear-gradient(180deg, #fff2a3 0%, #ffd700 40%, #b8860b 80%, #704f05 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
      line-height: 1.2;
    }
    .subtitle {
      font-style: italic;
      color: #e2d9c8;
      font-size: clamp(12px, 3.2vw, 15px);
      margin-bottom: 16px;
      letter-spacing: 1px;
    }
    .modal-box {
      width: min(92%, 400px);
      background: rgba(24, 18, 32, 0.92);
      border: 2px solid #d4af37;
      border-radius: 16px;
      padding: 18px 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.9);
      pointer-events: auto;
    }
    .input-field {
      width: 100%;
      padding: 13px 14px;
      border-radius: 12px;
      border: 1.5px solid rgba(212, 175, 55, 0.6);
      background: rgba(10, 8, 14, 0.95);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 14px;
      outline: none;
      -webkit-appearance: none;
    }
    .btn-main {
      width: 100%;
      padding: 15px 18px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #ffd700 0%, #d4af37 50%, #996515 100%);
      color: #120d03;
      font-family: 'Cinzel', serif;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 1px;
      cursor: pointer;
      touch-action: manipulation;
    }
    .btn-main:active { transform: scale(0.97); }

    .admin-gear {
      position: absolute;
      top: max(10px, env(safe-area-inset-top, 10px));
      right: 12px;
      font-size: 20px;
      background: rgba(20, 16, 26, 0.85);
      border: 1px solid rgba(212, 175, 55, 0.5);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 120;
      color: #d4af37;
    }

    .leader-table {
      width: 100%;
      max-height: 180px;
      overflow-y: auto;
      margin: 10px 0 16px 0;
      border-radius: 8px;
      background: rgba(10, 8, 14, 0.8);
      border: 1px solid rgba(212, 175, 55, 0.3);
    }
    .leader-row {
      display: flex;
      justify-content: space-between;
      padding: 7px 10px;
      font-size: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    .leader-row.me {
      background: rgba(212, 175, 55, 0.3);
      font-weight: 700;
      color: #ffd700;
    }
  </style>
</head>
<body>

<div id="game-container">
  <div class="admin-gear" id="admin-btn">⚙️</div>

  <div id="hud">
    <div class="hud-card">
      <span class="gold">🪙 <span id="coin-count">0</span></span>
      <span>•</span>
      <span class="hearts" id="hearts-display">❤️❤️❤️</span>
    </div>
    <div class="hud-card">
      <span id="player-hud-name">Гость</span>
      <span class="gold">⏱️ <span id="time-display">00:00</span></span>
    </div>
  </div>

  <div id="progress-wrap">
    <div id="progress-bar"></div>
  </div>

  <canvas id="canvas"></canvas>

  <div id="touch-controls">
    <div class="d-pad">
      <div class="t-btn" id="btn-left">◀</div>
      <div class="t-btn" id="btn-right">▶</div>
    </div>
    <div class="action-buttons">
      <div class="t-btn jump-btn" id="btn-jump">SALTO</div>
    </div>
  </div>

  <!-- Стартовый экран -->
  <div class="screen-overlay" id="start-screen">
    <h1 class="gold-title">BUON COMPLEANNO,<br>AMORE MIO!</h1>
    <p class="subtitle">Quiz Show Italiano • Римские каникулы</p>
