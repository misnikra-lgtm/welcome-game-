<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>IL MIO GIOCO - Quiz Show Italiano</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #0a060d;
      font-family: 'Montserrat', sans-serif;
      touch-action: none;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: #000;
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
    }

    #hud {
      position: absolute;
      top: max(10px, env(safe-area-inset-top, 10px));
      left: 10px;
      right: 56px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 50;
    }
    .hud-card {
      background: rgba(18, 12, 24, 0.92);
      border: 1.5px solid rgba(212, 175, 55, 0.7);
      padding: 6px 12px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    }
    .hud-card .gold { color: #ffd700; }
    .hud-card .hearts { color: #ff3366; letter-spacing: 2px; }

      position: absolute;
      top: max(54px, calc(env(safe-area-inset-top, 10px) + 44px));
